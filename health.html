<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.png" type="image/png" sizes="48x48" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <title>Press check · King Joshua Montayre</title>
    <meta name="theme-color" content="#e6e4de" />
    <script>
      // Same theme as the portfolio, set before first paint.
      (function () {
        try {
          var t = localStorage.getItem('theme');
          var dark = t ? t === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.classList.toggle('dark', dark);
          document.documentElement.dataset.theme = dark ? 'screen' : 'print';
          if (dark) document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0b0b0d');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/health/main.tsx"></script>
  </body>
</html>
